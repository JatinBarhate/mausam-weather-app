kind = "mobile"
previewPath = "/"
title = "MAUSAM Weather"
description = "A personalized weather app for people whose plans, health, and outdoor activities are affected by the weather. It combines live local forecasts with recommendations tailored to each person's interests, alongside a complete Pune-region demo mode."
version = "1.0.0"
id = "artifacts/mausam"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21031

[services.development]
run = "pnpm --filter @workspace/mausam run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mausam", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mausam", "run", "serve" ]

[services.env]
PORT = "21031"
BASE_PATH = "/"
